name: SuperMetroid3DS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Build .3dsx + headless gate (devkitARM + libctru)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOT recursive, and deliberately so. The upstream is a read-only external
      # checkout, not a submodule: see CMakeLists.txt. The DS-era CI checked out
      # submodules recursively, which is how an in-place edit to a read-only tree
      # (PPU_T0_DECL in snes/ppu.c) stayed invisible to review.
      - name: Checkout upstream (read-only, pinned)
        run: |
          git clone --depth 1 --branch v0.3.11 --recurse-submodules \
            https://github.com/mstan/SuperMetroidRecomp.git /tmp/upstream
          echo "VERSION=$(cat /tmp/upstream/VERSION)" >> $GITHUB_ENV
          echo "UPSTREAM_ROOT=/tmp/upstream" >> $GITHUB_ENV

      - name: Verify upstream pin
        run: |
          test "$(cat /tmp/upstream/VERSION)" = "0.3.11" || {
            echo "unexpected upstream VERSION: $(cat /tmp/upstream/VERSION)"; exit 1; }
          dirty=$(cd /tmp/upstream && git status --porcelain | wc -l)
          test "$dirty" -eq 0 || { echo "upstream must be clean, has $dirty changes"; exit 1; }

      - name: Lint
        run: |
          dkp-pacman -S --noconfirm --needed cppcheck
          # Same command `make lint` runs. Invoked directly rather than through
          # make because `make lint` uses docker, and this job is already inside
          # the image — nesting docker-in-container on a runner is a worse way to
          # get the same result.
          cppcheck --enable=warning,style --std=c11 --error-exitcode=1 \
            --suppress=missingIncludeSystem --quiet \
            -I frontend/3ds -I platform/3ds \
            frontend platform

      - name: Build frontend (.3dsx)
        run: |
          cmake -S . -B build3ds \
            -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/3DS.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DUPSTREAM_ROOT=/tmp/upstream \
            -DGEN_DIR=/tmp/gen
          cmake --build build3ds -j$(nproc)

      - name: Verify artifact
        run: |
          test -f build3ds/supermetroid3ds.3dsx
          ls -la build3ds/supermetroid3ds.3dsx

      # The core is deliberately NOT built here. src/gen is ~88 MB of C derived
      # from the ROM, the ROM is not in the repository by design, and regenerating
      # it takes far longer than a CI runner should spend. So this job proves the
      # frontend and the build wiring, and says so rather than implying coverage
      # it does not have. Core coverage belongs on a self-hosted runner with a ROM.
      - name: Note the gap
        run: |
          echo "::warning::CI builds the frontend only. The recompiled core is not"
          echo "::warning::built or run here: src/gen is generated from the ROM, which"
          echo "::warning::is not in this repository. See docs/3DS-PORT-STUDY.md."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: supermetroid3ds-3dsx
          path: build3ds/supermetroid3ds.3dsx

  gate:
    name: Headless behavioural gate (Azahar)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: supermetroid3ds-3dsx

      - name: Install Azahar
        run: |
          curl -sL -o azahar.AppImage \
            https://github.com/azahar-emu/azahar/releases/download/2126.2/azahar.AppImage
          chmod +x azahar.AppImage && ./azahar.AppImage --appimage-extract
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run the gate
        env:
          AZAHAR: ${{ github.workspace }}/squashfs-root/usr/bin/azahar
        run: |
          bash scripts/gate-headless.sh supermetroid3ds.3dsx 120

      # As in the build job, the core is not linked, so a pass here means "the
      # frontend boots and terminates on cue" and nothing more. The gate prints
      # this note itself; the note here is for the log reader.
      - name: Interpret
        run: |
          echo "with_core=0 is expected: this gate covers the frontend, not the game."